<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invitación de boda — Experiencia cinematográfica</title>
    <meta
      name="description"
      content="Prototipo cinematográfico de invitación de boda con GSAP y ScrollTrigger."
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body class="envelope-intro-pending">
    <section class="envelope-intro" data-envelope-intro aria-labelledby="envelope-title">
      <div class="envelope-intro__glow" aria-hidden="true"></div>
      <div class="envelope-intro__content">
        <p class="eyebrow envelope-intro__eyebrow" data-copy="envelopeEyebrow"></p>
        <div class="envelope" data-envelope-shell aria-hidden="true">
          <div class="envelope__back"></div>
          <div class="envelope__inner-card" data-envelope-card>
            <span data-copy="envelopeNames"></span>
            <small data-copy="envelopeDate"></small>
          </div>
          <div class="envelope__top-flap" data-envelope-flap></div>
          <div class="envelope__front"></div>
          <div class="envelope__seal" data-envelope-seal>
            <span data-copy="envelopeSealInitials"></span>
          </div>
        </div>
        <h1 id="envelope-title" class="envelope-intro__title" data-copy="envelopeNames"></h1>
        <p class="envelope-intro__date" data-copy="envelopeDate"></p>
        <button class="envelope-intro__button" type="button" data-envelope-open data-copy="envelopeButtonText"></button>
      </div>
    </section>

    <main class="invitation-content" data-invitation-content aria-hidden="true">
      <section class="scroll-section prelude" aria-labelledby="intro-title">
        <div class="prelude-media" aria-hidden="true">
          <img
            class="prelude-background"
            data-image="preludeBackground"
            alt=""
            aria-hidden="true"
          />
        </div>
        <div class="section-copy prelude-copy">
          <p class="eyebrow" data-copy="introEyebrow"></p>
          <h1 id="intro-title" class="quince-name" data-copy="quinceName"></h1>
          <p class="intro-description" data-copy="introTitle"></p>
          <p data-copy="introText"></p>
          <span class="scroll-cue" aria-hidden="true">Desliza</span>
        </div>
      </section>

      <section
        class="details-section countdown-section cinematic-panel"
        aria-labelledby="countdown-title"
      >
        <div class="section-copy details-copy countdown-copy">
          <p class="eyebrow" data-copy="countdownEyebrow"></p>
          <h2 id="countdown-title" data-copy="countdownTitle"></h2>
          <p class="countdown-date" data-copy="countdownDateText"></p>
          <div class="countdown" data-countdown>
            <div class="countdown-item">
              <span class="countdown-value" data-countdown-value="days">00</span>
              <span class="countdown-label" data-copy="countdownDaysLabel"></span>
            </div>
            <div class="countdown-item">
              <span class="countdown-value" data-countdown-value="hours">00</span>
              <span class="countdown-label" data-copy="countdownHoursLabel"></span>
            </div>
            <div class="countdown-item">
              <span class="countdown-value" data-countdown-value="minutes">00</span>
              <span class="countdown-label" data-copy="countdownMinutesLabel"></span>
            </div>
            <div class="countdown-item">
              <span class="countdown-value" data-countdown-value="seconds">00</span>
              <span class="countdown-label" data-copy="countdownSecondsLabel"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="cinema-scene" aria-labelledby="story-title">
        <img
          class="scene-backdrop"
          data-image="venue"
          alt=""
          aria-hidden="true"
        />
        <div class="film-grain" aria-hidden="true"></div>
        <div class="orbital-halo" aria-hidden="true"></div>
        <div class="depth-ring" aria-hidden="true"></div>

        <figure class="hero-frame" aria-label="Retrato principal de la pareja">
          <img data-image="hero" alt="" />
        </figure>

        <div class="floating-gallery" aria-hidden="true">
          <figure class="image-card image-card--dress">
            <img data-image="dress" alt="" />
          </figure>
          <figure class="image-card image-card--flowers">
            <img data-image="flowers" alt="" />
          </figure>
        </div>

        <div class="scene-content">
          <p class="kicker" data-copy="storyKicker"></p>
          <h2 class="cinematic-title" id="story-title" data-copy="storyTitle"></h2>
          <p class="cinematic-subtitle" data-copy="storySubtitle"></p>
        </div>
      </section>

      <section
        class="details-section venue-section cinematic-panel"
        aria-labelledby="venue-title"
      >
        <div class="section-copy details-copy">
          <p class="eyebrow" data-copy="venueEyebrow"></p>
          <h2 id="venue-title" data-copy="venueTitle"></h2>
          <p data-copy="venueIntro"></p>
        </div>

        <div class="details-grid" aria-label="Detalles de ubicación del evento">
          <article class="detail-card">
            <p class="detail-label" data-copy="venueNameLabel"></p>
            <h3 data-copy="venueName"></h3>
            <p data-copy="venueAddress"></p>
            <a
              class="map-button"
              data-map-link
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              data-copy="venueMapButtonLabel"
            ></a>
          </article>

          <article class="detail-card">
            <p class="detail-label" data-copy="venueTimeLabel"></p>
            <h3 data-copy="venueTime"></h3>
            <p data-copy="venueNote"></p>
          </article>
        </div>
      </section>

      <section
        class="details-section rsvp-section cinematic-panel"
        aria-labelledby="rsvp-title"
      >
        <div class="rsvp-panel">
          <p class="eyebrow" data-copy="rsvpEyebrow"></p>
          <h2 id="rsvp-title" data-copy="rsvpTitle"></h2>
          <p data-copy="rsvpText"></p>
          <a
            class="whatsapp-button"
            data-whatsapp-link
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            data-copy="rsvpButtonLabel"
          ></a>
        </div>
      </section>

      <section class="scroll-section epilogue cinematic-panel" aria-labelledby="after-title">
        <div class="section-copy">
          <p class="eyebrow" data-copy="closingEyebrow"></p>
          <h2 id="after-title" data-copy="closingTitle"></h2>
          <p class="date-line" data-copy="dateLine"></p>
          <p data-copy="closingText"></p>
        </div>
      </section>
    </main>

    <audio data-music-audio preload="none" playsinline hidden></audio>
    <button
      class="music-toggle"
      type="button"
      data-music-toggle
      aria-pressed="false"
      aria-label="Música no disponible"
      hidden
      disabled
    >
      <span class="music-toggle__icon" data-music-icon aria-hidden="true">♪</span>
      <span class="music-toggle__text" data-music-text>Música</span>
    </button>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="scripts/invitation-data.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
